<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
     <link rel="icon" color href=
    "images/leaf.png"
              type="image/x-icon">
  </head>
  <body
    class="h-screen bg-no-repeat bg-cover bg-center flex justify-center items-center"
    style="background-image: url('./images/main_bg.png')"
  >
    <!-- Audio Container -->
    <div class="audio-container fixed bottom-0 right-0">
      <audio id="bg-music" controls loop>
        <source src="audio/shop.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
    </div>

    <div class="max-w-screen-lg mx-auto p-6 ">
      <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="relative group">
          <img src="images/heartstopper.gif" alt="Image 1" class="w-full scale-105 h-56 object-cover rounded-lg transition-all duration-300 ease-in-out transform group-hover:scale-105" />
          <div class="absolute inset-0 opacity-30 group-hover:opacity-50 rounded-lg transition-opacity duration-300"></div>
        </div>
        <div class="relative group">
          <img src="images/Cooking.gif" alt="Image 2" class="w-full  h-56 object-cover rounded-lg transition-all duration-300 ease-in-out transform group-hover:scale-105" />
          <div class="absolute inset-0 opacity-30 group-hover:opacity-50 rounded-lg transition-opacity duration-300"></div>
        </div>
        <div class="relative group">
          <img src="images/snowboarding.gif" alt="Image 3" class="w-full h-56 object-cover rounded-lg transition-all duration-300 ease-in-out transform group-hover:scale-105" />
          <div class="absolute inset-0 opacity-30 group-hover:opacity-50 rounded-lg transition-opacity duration-300"></div>
        </div>
        <div class="relative group">
          <img src="images/dance.gif" alt="Image 4" class="w-full h-56 object-cover rounded-lg transition-all duration-300 ease-in-out transform group-hover:scale-105" />
          <div class="absolute inset-0 opacity-30 group-hover:opacity-50 rounded-lg transition-opacity duration-300"></div>
        </div>
        <div class="relative group">
          <img src="images/gaming.gif" alt="Image 4" class="w-full h-56 object-cover rounded-lg transition-all duration-300 ease-in-out transform group-hover:scale-105" />
          <div class="absolute inset-0  opacity-30 group-hover:opacity-50 rounded-lg transition-opacity duration-300"></div>
        </div> <div class="relative group">
          <img src="images/listening to music.gif" alt="Image 4" class="w-full h-56 object-cover rounded-lg transition-all duration-300 ease-in-out transform group-hover:scale-105" />
          <div class="absolute inset-0 opacity-30 group-hover:opacity-50 rounded-lg transition-opacity duration-300"></div>
        </div>
        <!-- Add more images here -->
      </div>
    </div>
    
    

   
    

    <!-- Back Button -->
    <button id="back" class="absolute top-4 left-4 z-10">
      <img
        class="transform scale-90 md:scale-100 transition-transform duration-300 ease-in-out hover:scale-105"
        src="./images/back_btn.png"
        alt="Back"
      />
    </button>

    <audio id="sound" src="audio/click1.mp3"></audio>

    <script>
      function setupButton(buttonId, redirectUrl) {
        document
          .getElementById(buttonId)
          .addEventListener("click", async function () {
            const audio = document.getElementById("sound");
            try {
              await audio.play();
              audio.onended = () => {
                window.location.href = redirectUrl;
              };
            } catch (error) {
              console.error("Error playing sound:", error);
              window.location.href = redirectUrl;
            }
          });
      }
      setupButton("back", "./about.html");

      const audio = document.getElementById("bg-music");

      window.onload = () => {
        const savedTime = localStorage.getItem("songTime");
        const savedVolume = localStorage.getItem("audioVolume");
        const savedState = localStorage.getItem("audioState");

        if (savedTime) {
          audio.currentTime = parseFloat(savedTime); // Convert to a number
        }

        if (savedVolume) {
          audio.volume = parseFloat(savedVolume); // Convert to a number
        } else {
          audio.volume = 0.2; // Default volume
        }

        if (savedState === "playing") {
          audio.play(); // Resume playback if previously playing
        } else if (savedState === "paused") {
          audio.pause(); // Ensure it stays paused
        }
      };

      window.onbeforeunload = () => {
        localStorage.setItem("songTime", audio.currentTime.toString());
        localStorage.setItem("audioVolume", audio.volume.toString());
        localStorage.setItem("audioState", audio.paused ? "paused" : "playing"); // Save play/pause state
      };

      // Optional: Add an event listener for pause/play
      audio.addEventListener("play", () => {
        localStorage.setItem("audioState", "playing");
      });

      audio.addEventListener("pause", () => {
        localStorage.setItem("audioState", "paused");
      });
    </script>
  </body>
</html>
